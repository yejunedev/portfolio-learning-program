<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        margin: 0;
        padding: 0;
    }

    h1 {
        font-size: 63px;
    }

    .game {
        background-color: #92D27F;
        padding: 40px 50px
    }

    #job {
        display: inline-block;
        background: linear-gradient(180deg, #DCFFD7 0%, #089D12 100%);
        border-radius: 20px;
        padding: 8px 20px;
        margin-top: 10px;
        font-size: 18px;
    }

    .menu {
        margin-left: 40px;
        padding-top: 25px;
        font-size: 20px;
    }


    #card {
        display: flex;
        gap: 12px;
        margin-top: 18px;
        margin-bottom: 25px;
    }

    #card p {
        background-color: #6BC450;
        color: #000000;
        padding: 10px 20px;
        border-radius: 13px;
        font-size: 15px;
    }

    #pro {
        color: #8d8989;
        font-weight: bold;
        margin-bottom: 20px;
    }

    #opop p{
        margin-bottom: 20px;
        padding-top: 5px;
    }
    hr {
        margin-bottom: 20px;
        width: 97%;

    }
    .action-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 24px;
}

.action-buttons button {
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

.btn-pdf {
    background-color: #3366FF;
    color: #fff;
}

.btn-edit {
    background-color: #eee;
    color: #333;
}

@media print {
    .no-print {
        display: none;
    }


    * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}
</style>



<body>
    
    <div class="game">
        <h1>김미림</h1>
        <div id="job">
            <p>게임 개발자</p>
        </div>

    </div>
    <div class="menu">
        <p style="color: #585555;">플레이어의 몰입을 고민하는 게임 개발자입니다.</p>

        <div id="card">
            <p>Unituy</p>
            <p>C#</p>
            <p>C++</p>
        </div>
        <div id="pro">
            <p>PROJECT</p>
        </div>
        <div id="opop">
            <p>던전 로그라이트</p>
            <hr>
            <p>2D 플랫포머 게임</p>
            <p style="word-spacing: 70px; color: #585555;">Kimirim@gmail.com             github.com/gimmirimdev            Kimmirim12</p>
            <hr style="border: none; border-top: 1px solid #C0BEBE;">
        </div>
    </div>


    <div class="action-buttons no-print">
        <button class="btn-edit" onclick="location.href='input.html'">수정하기</button>
        <button class="btn-pdf" onclick="window.print()">PDF로 저장</button>
    </div>
</body>

</html>
