<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase 로그인 & 구글 로그인</title>
  <link rel="stylesheet" href="pr.css">
</head>
<body>

  <div class="card">
    <!-- 로그인 폼 영역 -->
    <div id="auth-section">
      <h2>로그인</h2>

      <!-- 구글 로그인 버튼 -->
      <button id="btn-google" class="btn-google">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Google 계정으로 계속하기
      </button>

      <div class="divider"><span>또는 이메일로 로그인</span></div>

      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="6자리 이상">
      </div>
      
      <div class="btn-group">
        <button id="btn-login" class="btn-primary">이메일 로그인</button>
        <button id="btn-signup" class="btn-secondary">회원가입</button>
      </div>
    </div>

    <!-- 대시보드 화면 (로그인 완료 시) -->
    <div id="dashboard-section" class="hidden">
      <h2>환영합니다!</h2>
      <div class="profile-wrap">
        <img id="user-photo" class="profile-img hidden" alt="프로필 사진">
        <p id="user-name" class="user-name"></p>
        <p id="user-email" class="user-email"></p>
      </div>
      <button id="btn-logout" class="btn-danger">로그아웃</button>
    </div>

    <p id="message" class="status-msg"></p>
  </div>

  <!-- 자바스크립트 연결 (type="module" 필수) -->
  <script type="module" src="pr.js"></script>
</body>
</html>
