<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #80AFFF 0%, #EBF1FF 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .page-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }

        .highlight-name {
            color: #C9EDFF;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        .sidebar {
            width: 300px;
            background-color: #DBE8FF;
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #8DABFF;
            flex-shrink: 0;
        }

        .profile-img-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 24px;
            background-color: #ddd;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 26px;
            font-weight: 350;
            color: #000000;
            margin-bottom: 6px;
        }

        .profile-job {
            font-weight: 300;
            font-size: 20px;
            margin-bottom: 28px;
        }

        .contact-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #333;
            text-decoration: none;
            padding-left: 25px;
        }

        .contact-icon {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-email {
            background-color: #4A90E2;
            color: white;
        }

        .icon-github {
            background-color: #333;
            color: white;
        }

        .icon-instagram {
            background-color: #E1306C;
            color: white;
        }

        .contact-item span {
            text-decoration: underline;
            word-break: break-all;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #222;
            margin-bottom: 12px;
        }

        .intro-text {
            font-size: 13px;
            color: #000000;
            line-height: 1.6;
        }

        .tech-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .tag-html {
            background-color: #FFDEBD;
            color: #FF7C62;
        }

        .tag-css {
            background-color: #BDD7FF;
            color: #6284FF;
        }

        .tag-js {
            background-color: #FFF9D3;
            color: #FFE033;
        }

        .tag-github {
            background-color: #BDC0C4;
            color: #515256;
        }

        .project-grid {
            display: flex;
            gap: 16px;
        }

        .project-card {
            flex: 1;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .project-thumbnail {
            width: 70px;
            height: 70px;
            background-color: #D9D9D9;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .cert-grid {
            display: flex;
            gap: 12px;
        }

        .cert-item {
            flex: 1;
            border: 1px solid #8EBCF4;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .cert-icon {
            width: 24px;
            height: 24px;
            background-color: #D9D9D9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        .footer-card {
            background: linear-gradient(90deg, #5BA5FF 17%, #9CC9FF 50%, #5BA5FF 82%);
            color: white;
            border-radius: 16px;
            padding: 24px;
        }

        .footer-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .footer-sub {
            font-size: 13px;
            opacity: 0.9;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }

        .action-buttons button {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-pdf {
            background-color: #3366FF;
            color: #ffffff;
        }

        .btn-edit {
            background-color: #eee;
            color: #333;
        }

        @media print {
            body {
                min-height: auto;
                display: block;
            }

            .no-print {
                display: none;
            }

            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .card,
            .footer-card {
                page-break-inside: avoid;
            }

            .page-title {
                margin-bottom: 12px;
            }

            @page {
                margin: 10mm;
            }
        }
    </style>
</head>

<body>

    <h1 class="page-title">안녕하세요, <span class="highlight-name" id="userName1"></span> 입니다</h1>

    <div class="container">

        <aside class="sidebar">
            <div class="profile-img-container">
                <img id="userPhoto" src="" alt="프로필 사진" class="profile-img">
            </div>
            <h2 class="profile-name" id="userName2"></h2>
            <p class="profile-job" id="userJob"></p>

            <div class="contact-list">
                <a href="#" class="contact-item" id="emailLink">
                    <img src="./img/이메일.svg" alt="이메일" class="contact-icon">
                    <span id="userEmail"></span>
                </a>
                <a href="#" class="contact-item" id="githubLink" target="_blank">
                    <img src="./img/깃허브.svg" alt="깃허브" class="contact-icon">
                    <span id="userGithub"></span>
                </a>
                <a href="#" class="contact-item" id="instaLink">
                    <img src="./img/인스타.svg" alt="인스타그램" class="contact-icon">
                    <span id="userInsta"></span>
                </a>
            </div>
        </aside>

        <main class="main-content">
        
            <section class="card">
                <div class="card-header">
                    <span><img src="./img/소개.svg" alt=""></span> 소개
                </div>
                <p class="intro-text" id="userIntro"></p>
            </section>

            <section class="card">
                <div class="card-header">
                    <span><img src="./img/기술 스택.svg" alt=""></span> 기술 스택
                </div>
                <div class="tech-tags" id="skillList"></div>
            </section>
            
            <section class="card">
                <div class="card-header">
                    <span><img src="./img/프로젝트.svg" alt=""></span> 프로젝트
                </div>
                <div class="project-grid" id="projectList"></div>
            </section>
        
            <section class="card">
                <div class="card-header">
                    <span><img src="./img/자격증.svg" alt="자격증"></span> 자격증
                </div>
                <div class="cert-grid" id="certList"></div>
            </section>
            
            <section class="footer-card">
                <h3 class="footer-title">함께 성장할 수 있는 기회를 기다립니다!</h3>
                <p class="footer-sub">언제든 편하게 연락해 주세요.</p>
            </section>
        </main>
    </div>

    <div class="action-buttons no-print">
        <button class="btn-edit" id="btnEditPortfolio">수정하기</button>
        <button class="btn-pdf" onclick="window.print()">PDF로 저장</button>
    </div>

    
    <div id="action-btn-container" class="no-print" style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; gap: 10px;">
        <button id="btn-save-project" style="padding: 10px 18px; background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            💾 저장하기
        </button>
        <button id="btn-go-home" style="padding: 10px 18px; background-color: #475569; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            🏠 홈으로
        </button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
           
            const urlParams = new URLSearchParams(window.location.search);
            const projectIndex = urlParams.get("projectIndex");

            let data = null;

            if (projectIndex !== null) {
                // 마이페이지에서 상세보기를 눌러서 들어온 경우
                const savedProjects = JSON.parse(localStorage.getItem("myProjects")) || [];
                data = savedProjects[projectIndex];
            } else {
               
                data = JSON.parse(localStorage.getItem("portfolio_draft_data")) || JSON.parse(localStorage.getItem("currentPortfolioDraft"));
            }

            // 2. 화면 태그들에 데이터 채우기
            if (data) {
                if (document.getElementById('userName1')) document.getElementById('userName1').textContent = data.name || '';
                if (document.getElementById('userName2')) document.getElementById('userName2').textContent = data.name || '';
                if (document.getElementById('userJob')) document.getElementById('userJob').textContent = data.job || '';
                if (document.getElementById('userIntro')) document.getElementById('userIntro').textContent = data.intro || '';

                if (data.photo && document.getElementById('userPhoto')) {
                    document.getElementById('userPhoto').src = data.photo;
                }

                if (document.getElementById('userEmail')) document.getElementById('userEmail').textContent = data.email || '';
                if (document.getElementById('emailLink')) document.getElementById('emailLink').href = 'mailto:' + (data.email || '');
                if (document.getElementById('userGithub')) document.getElementById('userGithub').textContent = data.github || '';
                if (document.getElementById('githubLink')) document.getElementById('githubLink').href = 'https://' + (data.github || '');
                if (document.getElementById('userInsta')) document.getElementById('userInsta').textContent = data.blog || '';

                if (document.getElementById('skillList')) {
                    document.getElementById('skillList').innerHTML = (data.tags || [])
                        .map(tag => `<span class="tag tag-github">${tag}</span>`)
                        .join('');
                }

                if (document.getElementById('projectList')) {
                    document.getElementById('projectList').innerHTML = (data.projects || [])
                        .filter(p => p && p.title)     
                        .map(p => {
                            // 이미지가 있으면 img 태그를, 없으면 기본 회색 박스를 만듭니다.
                            const imgHTML = p.image 
                                ? `<img src="${p.image}" alt="프로젝트 썸네일" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">`
                                : ``; 
                            
                            return `
                            <div class="project-card">
                                <div class="project-thumbnail" style="width: 70px; height: 70px; flex-shrink: 0; border-radius: 8px; background-color: #D9D9D9; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                                    ${imgHTML}
                                </div>
                                <div>
                                    <strong>${p.title}</strong><br>
                                    <span style="font-size:11px;color:#888;">${p.period || ''}</span><br>
                                    <span style="font-size:12px;">${p.desc || ''}</span>
                                </div>
                            </div>`
                        })
                        .join('');
                }

                if (document.getElementById('certList')) {
                    document.getElementById('certList').innerHTML = (data.certs || [])
                        .filter(c => c && c.name)    
                        .map(c => `
                            <div class="cert-item">
                                <img src="./img/자격증.svg" alt="${c.name}" class="cert-icon">
                                <span>${c.name} (${c.date || ''})</span>
                            </div>`)
                        .join('');
                }
            }

            const editBtn = document.getElementById("btnEditPortfolio");
            if (editBtn) {
                editBtn.addEventListener("click", () => {
                    location.href = projectIndex !== null ? `input.html?projectIndex=${projectIndex}` : 'input.html';
                });
            }
        });

        // 3. 저장 및 홈으로 이동 로직
        (function() {
            const currentTheme = "테마 1";

            function saveToMyProjects(showAlert = true) {
                const urlParams = new URLSearchParams(window.location.search);
                const projectIndex = urlParams.get("projectIndex");

                
                if (projectIndex !== null) {
                    return true;
                }

                const draft = JSON.parse(localStorage.getItem("portfolio_draft_data")) || JSON.parse(localStorage.getItem("currentPortfolioDraft"));

                if (!draft) {
                    alert("작성된 포트폴리오 데이터가 없습니다. 정보 입력 페이지로 이동합니다.");
                    location.href = "input.html";
                    return false;
                }

                draft.theme = currentTheme;

                const myProjects = JSON.parse(localStorage.getItem("myProjects")) || [];
                myProjects.push(draft);
                localStorage.setItem("myProjects", JSON.stringify(myProjects));

                localStorage.removeItem("portfolio_draft_data");
                localStorage.removeItem("currentPortfolioDraft");

                if (showAlert) {
                    alert("포트폴리오가 마이페이지에 성공적으로 저장되었습니다!");
                }
                return true;
            }

            // [저장하기] 버튼
            const saveBtn = document.getElementById("btn-save-project");
            if (saveBtn) {
                saveBtn.addEventListener("click", () => {
                    if (saveToMyProjects(true)) {
                        location.href = "myPage.html";
                    }
                });
            }

            // [홈으로] 버튼
            const homeBtn = document.getElementById("btn-go-home");
            if (homeBtn) {
                homeBtn.addEventListener("click", () => {
                    const draft = localStorage.getItem("portfolio_draft_data") || localStorage.getItem("currentPortfolioDraft");
                    if (draft) {
                        saveToMyProjects(false);
                    }
                    location.href = "myPage.html";
                });
            }
        })();
    </script>
</body>

</html>
