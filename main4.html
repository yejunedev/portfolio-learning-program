<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

    }

    body {
        margin: 0;
        padding: 0;
        background-color: #FFD5D5;
    }

    .result-bg {
        margin-left: 10px;
        padding-left: 40px;
        padding-top: 30px;
        max-width: 1200px;

    }

    .top-section {
        gap: 15px;
        margin-bottom: 30px;
        display: flex;

    }

    .profile-card {
        background-color: #FFE1E1;
        border: 1px solid #D01010;
        flex: 3.5;
        border-radius: 20px;
        padding: 25px 30px 20px 30px;

    }

    .profile-img {
        width: 130px;
        height: 130px;
        border-radius: 70%;
        object-fit: cover;
        margin-bottom: 12px;

    }

    .project-card {
        background-color: #FFE1E1;
        border: 1px solid #D01010;
        flex: 2.5;
        border-radius: 20px;
        padding: 25px 30px 20px 25px;


    }

    .name {
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 4px;
        color: #585555;
    }

    .job {
        font-size: 20px;
        color: #4E4D4D;
        margin-bottom: 12px;
    }

    .divider {
        border: none;
        border-top: 1px solid #000000;
        margin-bottom: 12px;
    }

    .intro {
        font-size: 27px;
        color: #4E4D4D;
    }

    .section-title {
        font-size: 25px;
        font-weight: bold;
        color: #333;
        margin-bottom: 12px;
        letter-spacing: 0.5px;
    }

    .project-list {
        list-style: none;
        margin-bottom: 15px;
    }

    .project-list li {
        font-size: 25px;
        color: #333;
        margin-bottom: 8px;
        padding-left: 14px;
        position: relative;
    }

    .project-list li::before {
        content: "•";
        position: absolute;
        left: 0;
    }

    .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .tag {
        background: linear-gradient(135deg, #FFAFAF 0%, #FF8080 100%);
        color: #4E4D4D;
        padding: 10px 40px 10px 40px;
        border-radius: 17px;
        font-size: 20px;
        margin-top: 150px;


    }


    .section {
        margin-bottom: 20px;
    }

    .section .section-title {
        color: #585555;
        font-size: 25px;
        margin-bottom: 12px;
    }

    .cert-tag {
        display: block;
        width: fit-content;
        background: linear-gradient(135deg, #FFAFAF 0%, #FF8080 100%);
        color: #4E4D4D;
        padding: 10px 35px 10px 35px;
        margin-top: 15px;
        margin-right: 10px;
        border-radius: 15px;
        font-size: 20px;

    }

    .contact-list {
        display: flex;
        flex-direction: row;
        gap: 80px;
        align-items: center;
        margin-top: 25px;
    }


    .contact-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 20px;
        color: #4E4D4D;
    }


    .contact-icon {
        width: 28px;
        height: 28px;
        object-fit: contain;
    }
    .action-buttons {
     position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
}

.action-buttons button {
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

.btn-pdf {
    background-color: #3366FF;
    color: #ffffff;
}

.btn-edit {
    background-color: #eee;
    color: #333;
}

@media print {
    .no-print {
        display: none;
    }


    * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}
</style>

<body>
    
    <div class="result-bg">

        <div class="top-section">


            <div class="profile-card">
                <img id="userPhoto"  src="" alt="프로필 사진" class="profile-img">
                <h2 class="name" id="userName"></h2>
                <p class="job" id="userJob"></p>
                <hr class="divider">
                <p class="intro" id="userIntro"></p>
            </div>

            <div class="project-card">
                <h3 class="section-title">PROJECT</h3>
                <ul class="project-list"  id="projectList"></ul>
                <div class="tags"  id="skillList"> </div>
            </div>

        </div>


        <div class="section">
            <h3 class="section-title">자격증 및 활동</h3>
            <div id="certList"></div>
        </div>

        <div class="contact-list">
            <div class="contact-item">
                <img src="./img/이메일.svg" alt="이메일" class="contact-icon">
                <span id="userEmail"></span>
            </div>
            <div class="contact-item">
                <img src="./img/깃허브.svg" alt="깃허브" class="contact-icon">
                <span id="userGithub"></span>
            </div>
            <div class="contact-item">
                <img src="./img/인스타.svg" alt="인스타그램" class="contact-icon">
                <span id="userBlog"></span>
            </div>
        </div>
        <hr style="margin-top: 20px; margin-bottom: 12px; border: none; border-top: 1px solid #777;">


         <div class="action-buttons no-print">
            <button class="btn-edit" onclick="location.href='input.html'">수정하기</button>
            <button class="btn-pdf" onclick="window.print()">PDF로 저장</button>
        </div>

    </div>
</body>

<script>
    const data = JSON.parse(localStorage.getItem('portfolio_draft_data'));

    if (data) {
        document.getElementById('userName').textContent = data.name;
        document.getElementById('userJob').textContent = data.job;
        document.getElementById('userIntro').textContent = data.intro;

        if (data.photo) {
            document.getElementById('userPhoto').src = data.photo;
        }

        document.getElementById('projectList').innerHTML = (data.projects || [])
            .filter(p => p.title)
            .map(p => `<li>${p.title}</li>`)
            .join('');

        document.getElementById('skillList').innerHTML = (data.tags || [])
            .map(tag => `<span class="tag">${tag}</span>`)
            .join('');

        document.getElementById('certList').innerHTML = (data.certs || [])
            .filter(c => c.name)
            .map(c => `<span class="cert-tag">${c.name}</span>`)
            .join('');

        document.getElementById('userEmail').textContent = data.email || '';
        document.getElementById('userGithub').textContent = data.github || '';
        document.getElementById('userBlog').textContent = data.blog || '';
    }
</script>

</html>
