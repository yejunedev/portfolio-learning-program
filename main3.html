<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;

    }

    body {
        margin: 0;
        padding: 0;
    }
    img {
        width: 150px;
        height: 150px;
        padding-left: 20px;
        padding-top: 20px;
        padding-bottom: 20px;
    }
    .card {
        display: flex;
        align-items: stretch;
        min-height: 729px;
    }
    .left-panel {
        background: linear-gradient(135deg, #FFFEE4 0%, #FAFF52 100%);
        color: #AB9B9B;
        display: flex;
        flex-direction: column;
        width: 350px;
        padding: 20px;
        padding-bottom: 20px;
    }
    .left-panel h1{
        padding-left: 25px;
    }
    .left-panel p{
        padding-left: 25px;
        padding-top: 7px;
        font-size: 20px;
    }
    
    .right-panel {
        flex: 1;
        padding: 28px 24px;
        margin-left: 30px;
    }
    .right-panel p{
        color: #A0A0A0;
        font-size: 25px;
        padding-top: 10px;
        padding-bottom: 10px;
        margin-top: 10px;
        margin-bottom: 15px;
    }


    .label-tag {
    display: block;
    font-size: 20px;
    justify-content: center;
    width: 100%;
    background-color: #FFFFFF;
    color: #AB9B9B;
    padding-left: 22px;
    border-radius: 12px;
    margin-top: 25px;
    margin-bottom: 6px;
    box-sizing: border-box;
    margin-left: 25px;
    width: calc(100% - 225px);
}

.label-tag-small {
    display: block;
    font-size: 20px;
    justify-content: center;
    width: 100%;
    background-color: #FFFFFF;
    color: #AB9B9B;
    padding-left: 22px;
    border-radius: 15px;
    margin-top: 16px;
    margin-bottom: 6px;
    box-sizing: border-box;
    margin-left: 25px;
    width: calc(100% - 250px);
}
h2 {
    color: #575353;
    font-weight: 440;
    font-size: 25px; 
}
.profile {
    display: block;
    width: fit-content;
    background-color: #FBFF95;
    color: #A0A0A0;
    font-size: 25px;
    padding: 15px 30px 15px 30px;
    border-radius: 17px;
    margin-top: 30px;
}
.action-buttons {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
}

.action-buttons button {
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

.btn-pdf {
    background-color: #3366FF;
    color: #ffffff;
}

.btn-edit {
    background-color: #eee;
    color: #333;
}

@media print {
    .no-print {
        display: none;
    }


    * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}

</style>

<body>
    
    <div class="card">
        <div class="left-panel">
            <img src="./img/김미림.svg" alt="">
            <h1>김미림</h1>
            <p>프론트엔드 개발자</p>


            <span class="label-tag">기술 스택</span>
            <p>React</p>
            <p>TypeScript</p>
            <p>Next.js</p>
            <p>Tailwind CSS</p>


            <span class="label-tag-small">자격증</span>
            <p>네트워크관리사 2급</p>
            <p>정보처리기능사</p>
        </div>

        <div class="right-panel">
            <h2>소개</h2>
            <p>사용자 경험을 고민하는 프론트엔드 개발자입니다.</p>
            <h2>프로젝트</h2>
            <div class="profile">포트폴리오 생성기</div>
            <div class="profile">미림 프로젝트</div>
            <div class="profile">따옴</div>
        </div>
    </div>

    <div class="action-buttons no-print">
        <button class="btn-edit" onclick="location.href='input.html'">수정하기</button>
        <button class="btn-pdf" onclick="window.print()">PDF로 저장</button>
    </div>
</body>

</html>
