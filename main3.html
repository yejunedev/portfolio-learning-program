<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

    }
    body {
        margin: 0;
        padding: 0;
        background-color: #FFD5D5;
    }
    .result-bg {
        margin-left: 10px;
        padding-left: 40px;
        padding-top: 30px;
        max-width: 620px;
    }

    .top-section {
        gap: 15px;
        margin-bottom: 30px;
        
    }

    .profile-card {
        background-color: #FFE1E1;
        border: 1px solid #D01010;
        width: 600px;
        height: 400px;
        border-radius: 20px;
        padding: 25px 30px 20px 30px;
        
    }
    .profile-img {
        width: 130px;
        height: 130px;
        border-radius: 70%;
        object-fit: cover;
        margin-bottom: 12px;
        
    }

    .name {
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 4px;
        color: #585555;
    }

    .job {
        font-size: 20px;
        color: #4E4D4D;
        margin-bottom: 12px;
    }

    .divider {
        border: none;
        border-top: 1px solid #000000;
        margin-bottom: 12px;
    }

    .intro {
        font-size: 25px;
        color: #4E4D4D;
    }

    /* 프로젝트 카드 */
    .section-title {
        font-size: 13px;
        font-weight: bold;
        color: #333;
        margin-bottom: 12px;
        letter-spacing: 0.5px;
    }

    .project-list {
        list-style: none;
        margin-bottom: 15px;
    }

    .project-list li {
        font-size: 13px;
        color: #333;
        margin-bottom: 8px;
        padding-left: 14px;
        position: relative;
    }

    .project-list li::before {
        content: "•";
        position: absolute;
        left: 0;
    }

    .tags {
        display: flex;
        gap: 8px;
    }

    .tag {
        background-color: #F79E9E;
        color: #fff;
        font-size: 12px;
        padding: 5px 14px;
        border-radius: 14px;
    }


    .section {
        margin-bottom: 20px;
    }

    .section .section-title {
        font-size: 17px;
        margin-bottom: 12px;
    }

    .cert-tag {
        display: inline-block;
        background-color: #F79E9E;
        color: #fff;
        font-size: 13px;
        padding: 6px 16px;
        border-radius: 14px;
        margin-right: 8px;
        margin-bottom: 8px;
    }

    
    .item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #333;
        margin-right: 20px;
    }

    .item svg {
        color: #333;
    }
</style>
<body>
    <div class="result-bg">

        <div class="top-section">

            
            <div class="profile-card">
                <img src="./img/김미림.svg" alt="프로필 사진" class="profile-img">
                <h2 class="name">김미림</h2>
                <p class="job">데이터 분석가</p>
                <hr class="divider">
                <p class="intro">숫자 뒤에 숨은 이야기를 찾는 데이터 분석가입니다. 작은 지표 하나가 의사결정을 바꾼다고 믿습니다.</p>
            </div>
            
            <div class="project-card">
                <h3 class="section-title">PROJECT</h3>
                <ul class="project-list">
                    <li>이탈 예측 대시보드</li>
                    <li>매출 트렌드 시각화</li>
                </ul>
                <div class="tags">
                    <span class="tag">Python</span>
                    <span class="tag">SQL</span>
                </div>
            </div>

        </div>

        
        <div class="section">
            <h3 class="section-title">자격증 및 활동</h3>
            <span class="cert-tag">빅데이터분석기사</span>
            <span class="cert-tag">ADsP</span>
        </div>

        <!-- 연락처 -->
        <span class="item">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16v16H4z"/>
        <path d="M4 4l8 8 8-8"/>
    </svg>
    Kimirim@gmail.com
</span>

    </div>

</body>
</html>
