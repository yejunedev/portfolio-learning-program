<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트폴리오 정보 입력</title>
  <link rel="stylesheet" href="./css/input.css">
  <script src="./js/input.js" defer></script>
</head>
<body>

  <div class="container">
    
    <!-- 상단 타이틀 영역 -->
    <!-- 1. 상단 타이틀 영역 -->
    <header class="header">
      <!-- 뒤로 가기 버튼을 맨 윗줄로 분리 -->
      <div class="back-wrap">
        <a href="./start.html" class="btn-back">← 뒤로 가기</a>
      </div>

      <span class="breadcrumb">정보 입력</span>
      <h1>나만의 멋진 포트폴리오 정보를 입력하세요</h1>
      <p>프로필, 기술 스택, 프로젝트 및 링크를 작성하는 화면입니다.</p>
    </header>

    
    <main class="grid-layout">
      
      <!-- ================= 좌측 칼럼 ================= -->
      <section class="col">
        
        <!-- 기본 정보 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>기본 정보</h2>
            <span class="badge">필수</span>
          </div>

          <div class="profile-box">
            <!-- 프로필 사진 업로드 영역 -->
            <div class="photo-area">
              <div class="circle-avatar" id="profilePreview">👤</div>
              <p class="photo-label">프로필 사진</p>
              
              <!-- 실제 파일 선택 창 (숨김 처리) -->
              <input type="file" id="photoInput" accept="image/*" style="display: none;">

              <div class="photo-btns">
                <button type="button" id="btnUpload">업로드</button>
                <button type="button" id="btnResetPhoto">초기화</button>
              </div>
            </div>

            <!-- 이름, 직무, 소개글 -->
            <div class="fields-area">
              <div class="row">
                <div class="field">
                  <label for="name">이름 *</label>
                  <input type="text" id="name" placeholder="이름을 입력하세요">
                </div>
                <div class="field">
                  <label for="job">직무 / 포지션 *</label>
                  <input type="text" id="job" placeholder="예: 프론트엔드 엔지니어">
                </div>
              </div>
              <div class="field">
                <label for="intro">자기소개 (한 줄 요약)</label>
                <textarea id="intro" placeholder="자신을 표현하는 소개글을 적어주세요."></textarea>
              </div>
            </div>
          </div>
        </article>

        <!-- 프로젝트 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>프로젝트</h2>
            <button type="button" class="btn-add">+ 프로젝트 추가</button>
          </div>

          <div class="sub-box">
            <div class="sub-box-title">새 프로젝트</div>
            <div class="row-3">
              <div class="field">
                <label for="projTitle">프로젝트명</label>
                <input type="text" id="projTitle" placeholder="프로젝트명">
              </div>
              <div class="field">
                <label for="projPeriod">진행기간</label>
                <input type="text" id="projPeriod" placeholder="YYYY.MM - YYYY.MM">
              </div>
              <div class="field">
                <label for="projDesc">설명 및 핵심 성과</label>
                <input type="text" id="projDesc" placeholder="역할과 성과를 작성하세요">
              </div>
            </div>
          </div>
        </article>

        <!-- 자격증 및 대외활동 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>자격증 및 대외활동</h2>
            <button type="button" class="btn-add">+ 항목 추가</button>
          </div>

          <div class="row-3">
            <div class="field">
              <label for="certName">활동/자격증명</label>
              <input type="text" id="certName" placeholder="예: 정보처리기사">
            </div>
            <div class="field">
              <label for="certOrg">발행처 / 주관사</label>
              <input type="text" id="certOrg" placeholder="예: 한국산업인력공단">
            </div>
            <div class="field">
              <label for="certDate">취득연월</label>
              <input type="text" id="certDate" placeholder="YYYY.MM">
            </div>
          </div>
        </article>

      </section>

      <!-- ================= 우측 칼럼 ================= -->
      <section class="col">
        
        <!-- 기술 스택 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>기술 스택</h2>
            <span class="text-gray">최대 12개 권장</span>
          </div>
          <p class="guide-text">보유 중인 핵심 기술과 개발 도구를 입력하세요.</p>
          <input type="text" id="stackInput" class="input-full" placeholder="+ 스택 추가 후 Enter">
          
          <div class="chips">
            <span>EX)</span>
            <button type="button">Next.js</button>
            <button type="button">Node.js</button>
            <button type="button">Figma</button>
            <button type="button">Git</button>
          </div>
        </article>

        <!-- 포트폴리오 테마 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>포트폴리오 테마</h2>
            <span class="text-gray" id="selected-theme-text">미선택</span>
          </div>
          <p class="guide-text">포인트 대표 컬러를 선택하세요.</p>
          
          <div class="color-palette">
            <button type="button" class="color-circle coral" data-theme="코랄 레드"></button>
            <button type="button" class="color-circle amber" data-theme="앰버 옐로우"></button>
            <button type="button" class="color-circle sky" data-theme="스카이 블루"></button>
            <button type="button" class="color-circle mint" data-theme="민트 그린"></button>
            <button type="button" class="color-circle custom" data-theme="커스텀 컬러">+</button>
          </div>
        </article>

        <!-- 소셜 및 연락처 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>소셜 및 연락처 링크</h2>
          </div>
          <div class="row-3">
            <div class="field">
              <label for="github">GitHub 주소</label>
              <input type="text" id="github" placeholder="github.com/...">
            </div>
            <div class="field">
              <label for="email">이메일 주소</label>
              <input type="email" id="email" placeholder="email@domain.com">
            </div>
            <div class="field">
              <label for="blog">블로그 / 노션</label>
              <input type="text" id="blog" placeholder="velog.io/...">
            </div>
          </div>
        </article>

      </section>
    </main>

    <!-- 하단 액션 버튼 바 -->
    <div class="bottom-bar">
      <span>필수 항목을 모두 작성한 후 생성을 눌러주세요.</span>
      <div class="action-btns">
        <button type="button" class="btn-save">임시 저장</button>
        <button type="button" class="btn-create">포트폴리오 생성하기 →</button>
      </div>
    </div>

  </div>

</body>
</html>
