<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보 입력 화면</title>
</head>




</body>
    <div>
        <button onclick="history.back()">← 뒤로</button>
        <b>Create Portfolio</b>
    </div>

    <hr>

    <h2>정보 입력</h2>
    <p>포트폴리오에 들어갈 기본 정보를 입력해주세요.</p>

    <div style="display: flex; gap: 40px;">
        
        <div style="flex: 1;">
        <section>
            <h3>프로필</h3>
            <p>이름: <input type="text"></p>
            <p>직무: <input type="text"></p>
            <p>자기소개: <br><textarea rows="3" cols="30"></textarea></p>
        </section>

        <section>
            <h3>프로젝트</h3>
            <input type="text" placeholder="프로젝트 이름">
            <button>+ 추가</button>
        </section>
        </div>

        <div style="flex: 1;">
        <section>
            <h3>기술 스택</h3>
            <button>HTML</button>
            <button>CSS</button>
            <button>+ 추가</button>
        </section>

        <section>
            <h3>자격증 및 활동</h3>
            <input type="text">
            <button>+ 추가</button>
        </section>

        <section>
            <h3>연락처 및 링크</h3>
            <input type="text" placeholder="github 링크 등">
        </section>

        <section>
            <h3>테마 색상</h3>
            <input type="color">
        </section>
        </div>

    </div>

    <br>
    <button style="float: right;">포트폴리오 생성하기</button>

</html>
</body>
</html>
