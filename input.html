<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트폴리오 정보 입력</title>
  <link rel="stylesheet" href="./css/input.css">
  <script src="./js/input.js" defer></script>
</head>
<body>

  <div class="container">

    <header class="header">
      <div class="back-wrap">
        <a href="start.html" class="btn-back">← 뒤로 가기</a>
      </div>
      <span class="breadcrumb">정보 입력</span>
      <h1>나만의 멋진 포트폴리오 정보를 입력하세요</h1>
      <p>프로필, 기술 스택, 프로젝트 및 활동 이력을 편리하게 작성하세요.</p>
    </header>

    <main class="grid-layout">

      <section class="col">
        
        <!-- 기본 정보 -->
        <article class="card">
          <div class="card-header">
            <h2>기본 정보</h2>
            <span class="badge">필수</span>
          </div>

          <div class="profile-box">
            <div class="photo-area">
              <div class="circle-avatar" id="profilePreview">👤</div>
              <p class="photo-label">프로필 사진</p>
              
              <input type="file" id="photoInput" accept="image/*" style="display: none;">

              <div class="photo-btns">
                <button type="button" id="btnUpload">업로드</button>
                <button type="button" id="btnResetPhoto">초기화</button>
              </div>
            </div>

            <div class="fields-area">
              <div class="row">
                <div class="field">
                  <label for="name">이름 *</label>
                  <input type="text" id="name" placeholder="이름을 입력하세요">
                </div>
                <div class="field">
                  <label for="job">직무 / 포지션 *</label>
                  <input type="text" id="job" placeholder="예: 프론트엔드 엔지니어">
                </div>
              </div>
              <div class="field">
                <label for="intro">자기소개 (한 줄 요약)</label>
                <textarea id="intro" placeholder="자신을 표현하는 소개글을 적어주세요."></textarea>
              </div>
            </div>
          </div>
        </article>

        <!-- 프로젝트 -->
        <article class="card">
          <div class="card-header">
            <h2>프로젝트</h2>
            <button type="button" class="btn-add" id="btnAddProject">+ 프로젝트 추가</button>
          </div>

          <div id="projectContainer" class="dynamic-container"></div>
        </article>

      </section>

      <section class="col">

        <article class="card">
          <div class="card-header">
            <h2>기술 스택</h2>
            <span class="text-gray" id="stackCount">0개 등록됨</span>
          </div>
          <p class="guide-text">기술을 입력하고 Enter를 누르거나 추천 태그를 클릭하세요.</p>
          
          <div class="tag-box" id="tagBox">
            <div class="tag-list" id="tagList"></div>
            <input type="text" id="stackInput" class="tag-input" placeholder="+ 스택 입력 후 Enter">
          </div>
          
          <div class="chips">
            <span>추천:</span>
            <button type="button" class="chip-item">+ Next.js</button>
            <button type="button" class="chip-item">+ Node.js</button>
            <button type="button" class="chip-item">+ Figma</button>
            <button type="button" class="chip-item">+ Git</button>
          </div>
        </article>


        <article class="card">
          <div class="card-header">
            <h2>자격증 및 대외활동</h2>
            <button type="button" class="btn-add" id="btnAddCert">+ 항목 추가</button>
          </div>

          <div id="certContainer" class="dynamic-container"></div>
        </article>


        <article class="card">
          <div class="card-header">
            <h2>소셜 및 연락처 링크</h2>
          </div>
          <div class="row-3">
            <div class="field">
              <label for="github">GitHub 주소</label>
              <input type="text" id="github" placeholder="github.com/...">
            </div>
            <div class="field">
              <label for="email">이메일 주소</label>
              <input type="email" id="email" placeholder="email@domain.com">
            </div>
            <div class="field">
              <label for="blog">블로그 / 노션</label>
              <input type="text" id="blog" placeholder="velog.io/...">
            </div>
          </div>
        </article>

      </section>
    </main>


    <div class="bottom-bar">
      <span>필수 항목을 모두 작성한 후 생성을 눌러주세요.</span>
      <div class="action-btns">
        <button type="button" class="btn-reset-all" id="btnResetAll">전체 초기화</button>
        <button type="button" class="btn-save" id="btnSaveStorage">임시 저장</button>
        <button type="button" class="next-btn" id="btnNextStorage">다음 →</button>
      </div>
    </div>

  </div>

  <script>
    let uploadedPhotoData = "";

    // 1. 프로필 사진 업로드 및 초기화
    const photoInput = document.getElementById("photoInput");
    const btnUpload = document.getElementById("btnUpload");
    const btnResetPhoto = document.getElementById("btnResetPhoto");
    const profilePreview = document.getElementById("profilePreview");

    if (btnUpload && photoInput) {
      btnUpload.addEventListener("click", () => photoInput.click());
    }

    if (photoInput && profilePreview) {
      photoInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            uploadedPhotoData = event.target.result;
            profilePreview.innerHTML = `<img src="${uploadedPhotoData}" alt="프로필" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
            autoSaveDraft();
          };
          reader.readAsDataURL(file);
        }
      });
    }

    if (btnResetPhoto && profilePreview) {
      btnResetPhoto.addEventListener("click", () => {
        uploadedPhotoData = "";
        if (photoInput) photoInput.value = "";
        profilePreview.innerHTML = "👤";
        autoSaveDraft();
      });
    }

    // 2. 현재 입력 폼의 모든 데이터 추출
    function getFormData() {
      const nameVal = document.getElementById("name") ? document.getElementById("name").value.trim() : "";
      const jobVal = document.getElementById("job") ? document.getElementById("job").value.trim() : "";
      const introVal = document.getElementById("intro") ? document.getElementById("intro").value.trim() : "";
      const githubVal = document.getElementById("github") ? document.getElementById("github").value.trim() : "";
      const emailVal = document.getElementById("email") ? document.getElementById("email").value.trim() : "";
      const blogVal = document.getElementById("blog") ? document.getElementById("blog").value.trim() : "";

      const today = new Date();
      const dateString = `${today.getFullYear()}.${today.getMonth() + 1}.${today.getDate()}`;

      // 기존 보관 데이터에서 태그, 프로젝트, 자격증 목록 유지
      const prevDraft = JSON.parse(localStorage.getItem("portfolio_draft_data")) || 
                        JSON.parse(localStorage.getItem("currentPortfolioDraft")) || {};

      return {
        ...prevDraft,
        name: nameVal,
        job: jobVal,
        intro: introVal,
        photo: uploadedPhotoData || prevDraft.photo || "",
        github: githubVal,
        email: emailVal,
        blog: blogVal,
        createdAt: prevDraft.createdAt || dateString
      };
    }

    // 3. 입력 시 실시간 로컬스토리지 자동 보관 (나갔다 들어와도 유지)
    function autoSaveDraft() {
      const data = getFormData();
      localStorage.setItem("portfolio_draft_data", JSON.stringify(data));
      localStorage.setItem("currentPortfolioDraft", JSON.stringify(data));
    }

    // input, textarea 입력 시 자동 저장 이벤트 바인딩
    const inputFields = ["name", "job", "intro", "github", "email", "blog"];
    inputFields.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener("input", autoSaveDraft);
      }
    });

    // 4. 페이지 진입 시 기존 저장 데이터 복원 (Restore)
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const projectIndex = urlParams.get("projectIndex");

      let savedData = null;

      if (projectIndex !== null) {
        // 기존 프로젝트를 수정하러 들어온 경우
        const myProjects = JSON.parse(localStorage.getItem("myProjects")) || [];
        savedData = myProjects[projectIndex];
      } else {
        // 작성 중이던 임시 저장 데이터가 있는 경우
        savedData = JSON.parse(localStorage.getItem("portfolio_draft_data")) || 
                    JSON.parse(localStorage.getItem("currentPortfolioDraft"));
      }

      if (savedData) {
        if (document.getElementById("name") && savedData.name) document.getElementById("name").value = savedData.name;
        if (document.getElementById("job") && savedData.job) document.getElementById("job").value = savedData.job;
        if (document.getElementById("intro") && savedData.intro) document.getElementById("intro").value = savedData.intro;
        if (document.getElementById("github") && savedData.github) document.getElementById("github").value = savedData.github;
        if (document.getElementById("email") && savedData.email) document.getElementById("email").value = savedData.email;
        if (document.getElementById("blog") && savedData.blog) document.getElementById("blog").value = savedData.blog;

        // 사진 복원
        if (savedData.photo && profilePreview) {
          uploadedPhotoData = savedData.photo;
          profilePreview.innerHTML = `<img src="${uploadedPhotoData}" alt="프로필" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
        }
      }
    });

    // 5. [전체 초기화] 버튼 클릭 시
    const resetAllBtn = document.getElementById("btnResetAll");
    if (resetAllBtn) {
      resetAllBtn.addEventListener("click", () => {
        if (confirm("작성 중인 모든 내용을 초기화하시겠습니까?")) {
          localStorage.removeItem("portfolio_draft_data");
          localStorage.removeItem("currentPortfolioDraft");
          location.reload();
        }
      });
    }

    // 6. [임시 저장] 클릭: 마이페이지에 저장 후 이동
    const saveBtn = document.getElementById("btnSaveStorage");
    if (saveBtn) {
      saveBtn.addEventListener("click", () => {
        const data = getFormData();
        if (!data.name && !data.job) {
          alert("이름 또는 직무를 입력해주세요.");
          return;
        }

        const myProjects = JSON.parse(localStorage.getItem("myProjects")) || [];
        myProjects.push(data);
        localStorage.setItem("myProjects", JSON.stringify(myProjects));

        alert("성공적으로 임시 저장되었습니다!");
        location.href = "myPage.html";
      });
    }

    const nextBtn = document.getElementById("btnNextStorage");
    if (nextBtn) {
      nextBtn.addEventListener("click", () => {
        const data = getFormData();
        if (!data.name && !data.job) {
          alert("이름 또는 직무를 입력해주세요.");
          return;
        }

        // 최신 입력 데이터 확정 저장 후 이동
        localStorage.setItem("portfolio_draft_data", JSON.stringify(data));
        localStorage.setItem("currentPortfolioDraft", JSON.stringify(data));

        location.href = "template.html";
      });
    }
  </script>
</body>
</html>
