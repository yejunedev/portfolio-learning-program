<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트폴리오 정보 입력</title>
  <link rel="stylesheet" href="./css/input.css">
  <script src="./js/input.js" defer></script>
</head>
<body>

  <div class="container">
    
    <!-- 1. 상단 타이틀 영역 -->
    <header class="header">
      <span class="breadcrumb">정보 입력</span>
      <h1>나만의 멋진 포트폴리오 정보를 입력하세요</h1>
      <p>프로필, 기술 스택, 프로젝트 및 링크를 작성하는 화면입니다.</p>
    </header>

    <!-- 2. 본문 2단 레이아웃 (왼쪽 / 오른쪽) -->
    <main class="grid-layout">
      
      <!-- ================= 좌측 칼럼 ================= -->
      <section class="col">
        
        <!-- 기본 정보 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>기본 정보</h2>
            <span class="badge">필수</span>
          </div>

          <!-- 프로필 사진 + 인풋 영역 -->
          <div class="profile-box">
            <!-- 사진 업로드 UI -->
            <div class="photo-area">
              <div class="circle-avatar">👤</div>
              <p class="photo-label">프로필 사진</p>
              <div class="photo-btns">
                <button type="button">업로드</button>
                <button type="button">초기화</button>
              </div>
            </div>

            <!-- 이름, 직무, 소개글 -->
            <div class="fields-area">
              <div class="row">
                <div class="field">
                  <label>이름 *</label>
                  <input type="text" placeholder="이름을 입력하세요">
                </div>
                <div class="field">
                  <label>직무 / 포지션 *</label>
                  <input type="text" placeholder="예: 프론트엔드 엔지니어">
                </div>
              </div>
              <div class="field">
                <label>자기소개 (한 줄 요약)</label>
                <textarea placeholder="자신을 표현하는 소개글을 적어주세요."></textarea>
              </div>
            </div>
          </div>
        </article>

        <!-- 프로젝트 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>프로젝트</h2>
            <button type="button" class="btn-add">+ 프로젝트 추가</button>
          </div>

          <!-- 프로젝트 개별 박스 -->
          <div class="sub-box">
            <div class="sub-box-title">새 프로젝트</div>
            <div class="row-3">
              <div class="field">
                <label>프로젝트명</label>
                <input type="text" placeholder="프로젝트명">
              </div>
              <div class="field">
                <label>진행기간</label>
                <input type="text" placeholder="YYYY.MM - YYYY.MM">
              </div>
              <div class="field">
                <label>설명 및 핵심 성과</label>
                <input type="text" placeholder="역할과 성과를 작성하세요">
              </div>
            </div>
          </div>
        </article>

        <!-- 자격증 및 대외활동 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>자격증 및 대외활동</h2>
            <button type="button" class="btn-add">+ 항목 추가</button>
          </div>

          <div class="row-3">
            <div class="field">
              <label>활동/자격증명</label>
              <input type="text" placeholder="예: 정보처리기사">
            </div>
            <div class="field">
              <label>발행처 / 주관사</label>
              <input type="text" placeholder="예: 한국산업인력공단">
            </div>
            <div class="field">
              <label>취득연월</label>
              <input type="text" placeholder="YYYY.MM">
            </div>
          </div>
        </article>

      </section>

      <!-- ================= 우측 칼럼 ================= -->
      <section class="col">
        
        <!-- 기술 스택 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>기술 스택</h2>
            <span class="text-gray">최대 12개 권장</span>
          </div>
          <p class="guide-text">보유 중인 핵심 기술과 개발 도구를 입력하세요.</p>
          <input type="text" class="input-full" placeholder="+ 스택 추가 후 Enter">
          
          <div class="chips">
            <span>EX)</span>
            <button type="button">Next.js</button>
            <button type="button">Node.js</button>
            <button type="button">Figma</button>
            <button type="button">Git</button>
          </div>
        </article>

        <!-- 포트폴리오 테마 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>포트폴리오 테마</h2>
            <span class="text-gray">미선택</span>
          </div>
          <p class="guide-text">포인트 대표 컬러를 선택하세요.</p>
          
          <!-- 원형 컬러 버튼들 (기본 선택 없음) -->
          <div class="color-palette">
            <button type="button" class="color-circle coral"></button>
            <button type="button" class="color-circle amber"></button>
            <button type="button" class="color-circle sky"></button>
            <button type="button" class="color-circle mint"></button>
            <button type="button" class="color-circle custom">+</button>
          </div>
        </article>

        <!-- 소셜 및 연락처 카드 -->
        <article class="card">
          <div class="card-header">
            <h2>소셜 및 연락처 링크</h2>
          </div>
          <div class="row-3">
            <div class="field">
              <label>GitHub 주소</label>
              <input type="text" placeholder="github.com/...">
            </div>
            <div class="field">
              <label>이메일 주소</label>
              <input type="email" placeholder="email@domain.com">
            </div>
            <div class="field">
              <label>블로그 / 노션</label>
              <input type="text" placeholder="velog.io/...">
            </div>
          </div>
        </article>

      </section>
    </main>

    <!-- 3. 하단 액션 버튼 바 -->
    <div class="bottom-bar">
      <span>필수 항목을 모두 작성한 후 생성을 눌러주세요.</span>
      <div class="action-btns">
        <button type="button" class="btn-save">임시 저장</button>
        <button type="button" class="btn-create">포트폴리오 생성하기 →</button>
      </div>
    </div>

  </div>

</body>
</html>
