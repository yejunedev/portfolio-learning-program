<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포트폴리오 정보 입력</title>
  <link rel="stylesheet" href="./css/input.css">
</head>
<body>

  <div class="container">
    
    <!-- 상단 타이틀 영역 -->
    <header class="header">
      <div class="back-wrap">
        <a href="start.html" class="btn-back">← 뒤로 가기</a>
      </div>
      <span class="breadcrumb">정보 입력</span>
      <h1>나만의 멋진 포트폴리오 정보를 입력하세요</h1>
      <p>프로필, 기술 스택, 프로젝트 및 활동 이력을 편리하게 작성하세요.</p>
    </header>

    <main class="grid-layout">

      <!-- ================= 좌측 칼럼 ================= -->
      <section class="col">
        
        <!-- 기본 정보 -->
        <article class="card">
          <div class="card-header">
            <h2>기본 정보</h2>
            <span class="badge">필수</span>
          </div>

          <div class="profile-box">
            <div class="photo-area">
              <div class="circle-avatar" id="profilePreview">👤</div>
              <p class="photo-label">프로필 사진</p>
              
              <input type="file" id="photoInput" accept="image/*" style="display: none;">

              <div class="photo-btns">
                <button type="button" id="btnUpload">업로드</button>
                <button type="button" id="btnResetPhoto">초기화</button>
              </div>
            </div>

            <div class="fields-area">
              <div class="row">
                <div class="field">
                  <label for="name">이름 *</label>
                  <input type="text" id="name" placeholder="이름을 입력하세요">
                </div>
                <div class="field">
                  <label for="job">직무 / 포지션 *</label>
                  <input type="text" id="job" placeholder="예: 프론트엔드 엔지니어">
                </div>
              </div>
              <div class="field">
                <label for="intro">자기소개 (한 줄 요약)</label>
                <textarea id="intro" placeholder="자신을 표현하는 소개글을 적어주세요."></textarea>
              </div>
            </div>
          </div>
        </article>

        <!-- 프로젝트 -->
        <article class="card">
          <div class="card-header">
            <h2>프로젝트</h2>
            <button type="button" class="btn-add" id="btnAddProject">+ 프로젝트 추가</button>
          </div>

          <div id="projectContainer" class="dynamic-container"></div>
        </article>

      </section>

      <!-- ================= 우측 칼럼 ================= -->
      <section class="col">

        <!-- 기술 스택 -->
        <article class="card">
          <div class="card-header">
            <h2>기술 스택</h2>
            <span class="text-gray" id="stackCount">0개 등록됨</span>
          </div>
          <p class="guide-text">기술을 입력하고 Enter를 누르거나 추천 태그를 클릭하세요.</p>
          
          <div class="tag-box" id="tagBox">
            <div class="tag-list" id="tagList"></div>
            <input type="text" id="stackInput" class="tag-input" placeholder="+ 스택 입력 후 Enter">
          </div>
          
          <div class="chips">
            <span>추천:</span>
            <button type="button" class="chip-item">+ Next.js</button>
            <button type="button" class="chip-item">+ Node.js</button>
            <button type="button" class="chip-item">+ Figma</button>
            <button type="button" class="chip-item">+ Git</button>
          </div>
        </article>

        <!-- 자격증 및 대외활동 -->
        <article class="card">
          <div class="card-header">
            <h2>자격증 및 대외활동</h2>
            <button type="button" class="btn-add" id="btnAddCert">+ 항목 추가</button>
          </div>

          <div id="certContainer" class="dynamic-container"></div>
        </article>

        <!-- 소셜 및 연락처 링크 -->
        <article class="card">
          <div class="card-header">
            <h2>소셜 및 연락처 링크</h2>
          </div>
          <div class="row-3">
            <div class="field">
              <label for="github">GitHub 주소</label>
              <input type="text" id="github" placeholder="github.com/...">
            </div>
            <div class="field">
              <label for="email">이메일 주소</label>
              <input type="email" id="email" placeholder="email@domain.com">
            </div>
            <div class="field">
              <label for="blog">블로그 / 노션</label>
              <input type="text" id="blog" placeholder="velog.io/...">
            </div>
          </div>
        </article>

      </section>
    </main>

    <!-- 하단 액션 바 -->
    <div class="bottom-bar">
      <span>필수 항목을 모두 작성한 후 생성을 눌러주세요.</span>
      <div class="action-btns">
        <button type="button" class="btn-reset-all" id="btnResetAll">전체 초기화</button>
        <button type="button" class="btn-save" id="btnSaveStorage">임시 저장</button>
        <button type="button" class="next-btn" id="btnNextStorage">다음 →</button>
      </div>
    </div>

  </div>

  <script>
    let uploadedPhotoData = "";
    let tagsArray = [];

    // --- 1. 기술 스택 (태그) 로직 ---
    const tagListEl = document.getElementById("tagList");
    const stackInput = document.getElementById("stackInput");
    const stackCount = document.getElementById("stackCount");

    function renderTags() {
      tagListEl.innerHTML = tagsArray.map((tag, idx) => `
        <span class="tag-badge" style="display:inline-flex; align-items:center; gap:6px; background:#eff6ff; color:#2563eb; padding:4px 10px; border-radius:14px; font-size:13px; margin:3px;">
          ${tag}
          <span onclick="removeTag(${idx})" style="cursor:pointer; font-weight:bold; font-size:14px;">✕</span>
        </span>
      `).join('');
      stackCount.textContent = `${tagsArray.length}개 등록됨`;
      autoSaveDraft();
    }

    function addTag(text) {
      const clean = text.trim().replace(/^#/, '').replace(/^\+/, '').trim();
      if (clean && !tagsArray.includes(clean)) {
        tagsArray.push(clean);
        renderTags();
      }
      stackInput.value = "";
    }

    window.removeTag = function(idx) {
      tagsArray.splice(idx, 1);
      renderTags();
    };

    stackInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        addTag(stackInput.value);
      }
    });

    document.querySelectorAll(".chip-item").forEach(chip => {
      chip.addEventListener("click", () => addTag(chip.textContent));
    });


    // --- 2. 프로젝트 동적 추가/삭제 ---
    const projectContainer = document.getElementById("projectContainer");
    const btnAddProject = document.getElementById("btnAddProject");

    function createProjectItem(data = {}) {
      const item = document.createElement("div");
      item.className = "dynamic-item project-item";
      item.style = "background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:15px; margin-bottom:12px; position:relative;";
      
      // 이미지가 있으면 배경으로 표시, 없으면 회색 바탕에 + 표시
      const imgPreviewStyle = data.image 
        ? `background-image: url(${data.image}); background-size: cover; background-position: center;`
        : `background: #e2e8f0;`;
      const imgPlaceholder = data.image ? '' : '<span style="font-size:24px; color:#94a3b8;">+</span>';

      item.innerHTML = `
        <button type="button" class="btn-item-del" style="position:absolute; top:10px; right:12px; background:none; border:none; color:#94a3b8; font-size:16px; cursor:pointer;" onclick="this.parentElement.remove(); autoSaveDraft();">✕</button>
        
        <div style="display: flex; gap: 15px; margin-bottom: 8px;">
          <!-- 썸네일 업로드 영역 -->
          <div class="proj-img-preview" style="width: 80px; height: 80px; border-radius: 8px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; ${imgPreviewStyle}" title="클릭하여 프로젝트 사진 업로드">
            ${imgPlaceholder}
          </div>
          <input type="file" class="proj-img-input" accept="image/*" style="display: none;">
          <input type="hidden" class="proj-img-data" value="${data.image || ''}">
          
          <div style="flex-grow: 1;">
            <div style="margin-bottom:8px;">
              <label style="font-size:12px; font-weight:600; color:#475569;">프로젝트명</label>
              <input type="text" class="proj-title" placeholder="프로젝트 이름" value="${data.title || ''}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; margin-top:4px; box-sizing:border-box;">
            </div>
            <div>
              <label style="font-size:12px; font-weight:600; color:#475569;">진행 기간</label>
              <input type="text" class="proj-period" placeholder="2026.03 - 2026.06" value="${data.period || ''}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; margin-top:4px; box-sizing:border-box;">
            </div>
          </div>
        </div>
        <div>
          <label style="font-size:12px; font-weight:600; color:#475569;">간단한 설명</label>
          <textarea class="proj-desc" placeholder="프로젝트 역할 및 소개" style="width:100%; height:60px; padding:8px; border:1px solid #cbd5e1; border-radius:6px; margin-top:4px; box-sizing:border-box; resize:none;">${data.desc || ''}</textarea>
        </div>
      `;

      // 썸네일 클릭 시 파일 업로드 창 띄우기
      const imgPreviewEl = item.querySelector('.proj-img-preview');
      const imgInputEl = item.querySelector('.proj-img-input');
      const imgDataEl = item.querySelector('.proj-img-data');

      imgPreviewEl.addEventListener('click', () => imgInputEl.click());

      // 이미지 첨부 시 Base64로 변환하여 미리보기 띄우기 및 저장
      imgInputEl.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const base64Data = event.target.result;
            imgDataEl.value = base64Data;
            imgPreviewEl.style.backgroundImage = `url(${base64Data})`;
            imgPreviewEl.style.backgroundSize = 'cover';
            imgPreviewEl.style.backgroundPosition = 'center';
            imgPreviewEl.style.backgroundColor = 'transparent';
            imgPreviewEl.innerHTML = ''; // '+' 아이콘 제거
            autoSaveDraft();
          };
          reader.readAsDataURL(file);
        }
      });

      // 텍스트 변경 시 자동 저장
      item.querySelectorAll("input[type='text'], textarea").forEach(el => {
        el.addEventListener("input", autoSaveDraft);
      });

      projectContainer.appendChild(item);
    }


    // --- 3. 자격증 동적 추가/삭제 ---
    const certContainer = document.getElementById("certContainer");
    const btnAddCert = document.getElementById("btnAddCert");

    function createCertItem(data = {}) {
      const item = document.createElement("div");
      item.className = "dynamic-item cert-item";
      item.style = "background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:15px; margin-bottom:12px; position:relative;";
      item.innerHTML = `
        <button type="button" class="btn-item-del" style="position:absolute; top:10px; right:12px; background:none; border:none; color:#94a3b8; font-size:16px; cursor:pointer;" onclick="this.parentElement.remove(); autoSaveDraft();">✕</button>
        <div style="margin-bottom:8px;">
          <label style="font-size:12px; font-weight:600; color:#475569;">자격증 / 활동명</label>
          <input type="text" class="cert-name" placeholder="정보처리기능사" value="${data.name || ''}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; margin-top:4px; box-sizing:border-box;">
        </div>
        <div>
          <label style="font-size:12px; font-weight:600; color:#475569;">취득일자 / 활동기간</label>
          <input type="text" class="cert-date" placeholder="2026.05" value="${data.date || ''}" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; margin-top:4px; box-sizing:border-box;">
        </div>
      `;

      item.querySelectorAll("input").forEach(el => {
        el.addEventListener("input", autoSaveDraft);
      });

      certContainer.appendChild(item);
    }

    btnAddCert.addEventListener("click", () => {
      createCertItem();
      autoSaveDraft();
    });


    // --- 4. 프로필 사진 업로드 & 초기화 ---
    const photoInput = document.getElementById("photoInput");
    const btnUpload = document.getElementById("btnUpload");
    const btnResetPhoto = document.getElementById("btnResetPhoto");
    const profilePreview = document.getElementById("profilePreview");

    btnUpload.addEventListener("click", () => photoInput.click());

    photoInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          uploadedPhotoData = event.target.result;
          profilePreview.innerHTML = `<img src="${uploadedPhotoData}" alt="프로필" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
          autoSaveDraft();
        };
        reader.readAsDataURL(file);
      }
    });

    btnResetPhoto.addEventListener("click", () => {
      uploadedPhotoData = "";
      photoInput.value = "";
      profilePreview.innerHTML = "👤";
      autoSaveDraft();
    });


    // --- 5. 전체 입력 데이터 수집 ---
    function getFormData() {
      const nameVal = document.getElementById("name").value.trim();
      const jobVal = document.getElementById("job").value.trim();
      const introVal = document.getElementById("intro").value.trim();
      const githubVal = document.getElementById("github").value.trim();
      const emailVal = document.getElementById("email").value.trim();
      const blogVal = document.getElementById("blog").value.trim();


      // 프로젝트 목록 추출
      const projects = [];
      document.querySelectorAll(".project-item").forEach(item => {
        const title = item.querySelector(".proj-title").value.trim();
        const period = item.querySelector(".proj-period").value.trim();
        const desc = item.querySelector(".proj-desc").value.trim();
        
        const imgDataEl = item.querySelector(".proj-img-data");
        const image = imgDataEl ? imgDataEl.value : ""; 
        
        if (title || period || desc || image) {
          projects.push({ title, period, desc, image });
        }
      });

      // 자격증 목록 추출
      const certs = [];
      document.querySelectorAll(".cert-item").forEach(item => {
        const name = item.querySelector(".cert-name").value.trim();
        const date = item.querySelector(".cert-date").value.trim();
        if (name || date) {
          certs.push({ name, date });
        }
      });

      const today = new Date();
      const dateString = `${today.getFullYear()}.${today.getMonth() + 1}.${today.getDate()}`;

      const prevDraft = JSON.parse(localStorage.getItem("portfolio_draft_data")) || 
                        JSON.parse(localStorage.getItem("currentPortfolioDraft")) || {};

      return {
        ...prevDraft,
        name: nameVal,
        job: jobVal,
        intro: introVal,
        photo: uploadedPhotoData || prevDraft.photo || "",
        tags: tagsArray,
        projects: projects,
        certs: certs,
        github: githubVal,
        email: emailVal,
        blog: blogVal,
        createdAt: prevDraft.createdAt || dateString
      };
    }

    // --- 6. 자동 저장 함수 ---
    function autoSaveDraft() {
      const data = getFormData();
      localStorage.setItem("portfolio_draft_data", JSON.stringify(data));
      localStorage.setItem("currentPortfolioDraft", JSON.stringify(data));
    }

    // 기본 텍스트 인풋 자동 저장 이벤트 연결
    ["name", "job", "intro", "github", "email", "blog"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("input", autoSaveDraft);
    });


    // --- 7. 화면 최초 로드 시 데이터 복원 ---
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const projectIndex = urlParams.get("projectIndex");

      let savedData = null;

      if (projectIndex !== null) {
        const myProjects = JSON.parse(localStorage.getItem("myProjects")) || [];
        savedData = myProjects[projectIndex];
      } else {
        savedData = JSON.parse(localStorage.getItem("portfolio_draft_data")) || 
                    JSON.parse(localStorage.getItem("currentPortfolioDraft"));
      }

      if (savedData) {
        if (savedData.name) document.getElementById("name").value = savedData.name;
        if (savedData.job) document.getElementById("job").value = savedData.job;
        if (savedData.intro) document.getElementById("intro").value = savedData.intro;
        if (savedData.github) document.getElementById("github").value = savedData.github;
        if (savedData.email) document.getElementById("email").value = savedData.email;
        if (savedData.blog) document.getElementById("blog").value = savedData.blog;

        // 사진 복원
        if (savedData.photo) {
          uploadedPhotoData = savedData.photo;
          profilePreview.innerHTML = `<img src="${uploadedPhotoData}" alt="프로필" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
        }

        // 태그 복원
        if (Array.isArray(savedData.tags)) {
          tagsArray = [...savedData.tags];
          renderTags();
        }

        // 프로젝트 복원
        if (Array.isArray(savedData.projects)) {
          projectContainer.innerHTML = "";
          savedData.projects.forEach(p => createProjectItem(p));
        }

        // 자격증 복원
        if (Array.isArray(savedData.certs)) {
          certContainer.innerHTML = "";
          savedData.certs.forEach(c => createCertItem(c));
        }
      }
    });


    // --- 8. 하단 버튼 액션 ---
    document.getElementById("btnResetAll").addEventListener("click", () => {
      const isConfirm = confirm("작성 중인 모든 내용을 초기화하시겠습니까?");
      if (isConfirm) {
        const userInput = prompt("초기화하려면 입력창에 '초기화'라고 정확히 입력해주세요.\n(주의: 모든 데이터가 영구적으로 삭제됩니다.)");
        
        if (userInput === "초기화") {
          localStorage.removeItem("portfolio_draft_data");
          localStorage.removeItem("currentPortfolioDraft");
          location.reload();
          alert("초기화가 완료되었습니다.");
        } else if (userInput !== null) {
          alert("입력한 단어가 일치하지 않아 초기화가 취소되었습니다.");
        }
      }
    });

    document.getElementById("btnSaveStorage").addEventListener("click", () => {
      const data = getFormData();
      if (!data.name && !data.job) {
        alert("이름 또는 직무를 입력해주세요.");
        return;
      }
      const myProjects = JSON.parse(localStorage.getItem("myProjects")) || [];
      myProjects.push(data);
      localStorage.setItem("myProjects", JSON.stringify(myProjects));
      alert("성공적으로 임시 저장되었습니다!");
      location.href = "myPage.html";
    });

    document.getElementById("btnNextStorage").addEventListener("click", () => {
      const data = getFormData();
      if (!data.name && !data.job) {
        alert("이름 또는 직무를 입력해주세요.");
        return;
      }
      localStorage.setItem("portfolio_draft_data", JSON.stringify(data));
      localStorage.setItem("currentPortfolioDraft", JSON.stringify(data));
      location.href = "template.html";
    });
  </script>
</body>
</html>
